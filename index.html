<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stocks Negativos x Fábrica</title>
<style>
  :root {
    --red: #cc0000;
    --red-dark: #990000;
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e0e0e0;
    --text: #222;
    --muted: #666;
    --green: #1a7f37;
    --amber: #b8860b;
    --banner: #f2a154;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: linear-gradient(135deg, var(--red), var(--red-dark));
    color: white;
    padding: 20px 24px;
  }
  header h1 { margin: 0 0 4px 0; font-size: 22px; }
  header .sub { font-size: 13px; opacity: 0.9; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  #refreshBtn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #refreshBtn:hover { background: rgba(255,255,255,0.3); }
  #status { font-size: 13px; }
  .tabs-primary {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding: 16px 24px 0 24px;
    border-bottom: 2px solid var(--red);
  }
  .tab-primary {
    padding: 9px 18px;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    background: #ececec;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
  }
  .tab-primary.active {
    background: var(--red);
    color: white;
    border-color: var(--red);
  }
  .tab-primary .count {
    display: inline-block; margin-left: 6px;
    background: rgba(0,0,0,0.08); border-radius: 10px; padding: 0 6px; font-size: 11px;
  }
  .tab-primary.active .count { background: rgba(255,255,255,0.25); }
  .tab-primary.empty { opacity: 0.45; }
  .tab-primary.new-tab { background: #fff8e6; border-color: var(--amber); color: var(--amber); }
  .tab-primary.new-tab.active { background: var(--amber); border-color: var(--amber); color: white; }

  .tabs-secondary {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 10px 24px;
    background: #fdf0f0;
    border-bottom: 1px solid var(--border);
  }
  .tab-secondary {
    padding: 5px 12px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
  }
  .tab-secondary.active {
    background: var(--red-dark);
    color: white;
    border-color: var(--red-dark);
  }
  .tab-secondary.all-btn.active { background: #333; border-color: #333; }
  .tab-secondary .count {
    display: inline-block; margin-left: 5px;
    background: rgba(0,0,0,0.08); border-radius: 10px; padding: 0 5px; font-size: 10px;
  }
  .tab-secondary.active .count { background: rgba(255,255,255,0.25); }
  .tab-secondary.empty { opacity: 0.45; }
  .tab-secondary.filtro-familia {
    margin-left: 10px;
    border: 1px dashed var(--amber);
    background: #fff8e6;
    color: var(--amber);
    font-weight: 600;
  }
  .tab-secondary.filtro-familia.active {
    background: var(--amber);
    border-style: solid;
    border-color: var(--amber);
    color: white;
  }

  main { padding: 16px 24px 8px 24px; }
  .sub-banner {
    background: var(--banner);
    color: white;
    font-weight: 700;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    margin: 18px 0 10px 0;
  }
  .sub-banner:first-child { margin-top: 0; }
  .familia-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .familia-title {
    background: #fafafa;
    padding: 10px 16px;
    font-weight: 600;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid #f0f0f0;
    overflow-wrap: break-word;
    word-break: break-word;
    vertical-align: top;
  }
  th {
    background: #fbfbfb;
    color: var(--muted);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  tr:last-child td { border-bottom: none; }
  .neg { color: var(--red); font-weight: 700; }
  .ocdif-cubierto { color: var(--green); font-weight: 600; }
  .ocdif-falta { color: var(--red); font-weight: 600; }
  .muted { color: var(--muted); }
  .empty-msg {
    text-align: center; padding: 40px; color: var(--muted); font-size: 14px;
  }
  #errorBanner {
    display: none;
    background: #fff3cd; border: 1px solid #ffe69c; color: #664d03;
    padding: 10px 16px; margin: 16px 24px 0 24px; border-radius: 8px; font-size: 13px;
  }
  #loadingBanner {
    padding: 40px; text-align: center; color: var(--muted);
  }
  .totales-footer {
    margin: 8px 24px 32px 24px;
    background: #eef2ff;
    border: 1px solid #c7d2fe;
    border-radius: 10px;
    padding: 14px 0;
    font-size: 13px;
  }
  /* fila interna alineada a las mismas proporciones de columnas que las tablas,
     para que "Suma total de negativos" quede exactamente debajo de "Stock negativo" */
  .totales-footer .tf-row { display: flex; flex-wrap: wrap; row-gap: 6px; align-items: center; width: 100%; }
  .totales-footer .tf-cell { padding: 0 12px; box-sizing: border-box; min-width: 0; max-width: 100%; }
  .totales-footer .tf-center { text-align: center; }
  .totales-footer .item .num { font-size: 20px; font-weight: 700; color: #333; }
  .totales-footer .item .num.neg { color: var(--red); }
  .totales-footer .item .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; }
  .totales-footer .evo { display:flex; align-items:center; gap:8px; margin-left:auto; flex-wrap: wrap; max-width: 100%; }
  .totales-footer .evo .delta { font-size: 15px; font-weight:700; padding:4px 14px; border-radius:14px; }
  .totales-footer .evo .delta.mejor { color: var(--green); background:#eaf6ec; }
  .totales-footer .evo .delta.peor { color: var(--red); background:#fdeaea; }
  .totales-footer .evo .lbl2 { font-size:11px; color:var(--muted); }

  .tbl-main col.c-cod { width: 8%; }
  .tbl-main col.c-desc { width: 26%; }
  .tbl-main col.c-fisico { width: 11%; }
  .tbl-main col.c-pend { width: 10%; }
  .tbl-main col.c-stock { width: 11%; }
  .tbl-main col.c-oc { width: 17%; }
  .tbl-main col.c-ocdif { width: 17%; }
  .tbl-new col.c-cod { width: 9%; }
  .tbl-new col.c-desc { width: 26%; }
  .tbl-new col.c-fisico { width: 11%; }
  .tbl-new col.c-pend { width: 10%; }
  .tbl-new col.c-stock { width: 13%; }
  .tbl-new col.c-origen { width: 31%; }

  #captureBtn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #captureBtn:hover { background: rgba(255,255,255,0.3); }
  #captureBtn:disabled { opacity: 0.6; cursor: default; }
  #captureMsg {
    display: none;
    font-size: 12px;
    background: rgba(255,255,255,0.2);
    padding: 4px 10px;
    border-radius: 6px;
  }

  /* Tabla estilo Excel compacto, usada SOLO por el botón "Copiar imagen (WhatsApp)":
     FAMILIA como columna angosta (el texto solo aparece en la primera fila de cada
     familia, igual que en el Excel real), anchos autoajustados por texto vía canvas,
     y los mismos colores de formato condicional del Excel original. Esta tabla vive
     siempre oculta en #mainCaptura/#footerCaptura y nunca se muestra en la vista en vivo. */
  .xtable { width: auto; margin: 0 auto 14px auto; font-size: 11px; }
  .xtable th, .xtable td {
    padding: 2px 5px;
    line-height: 1.25;
    border-bottom: 1px solid #e3e3e3;
    overflow-wrap: break-word;
    word-break: break-word;
    vertical-align: middle;
  }
  .xtable thead th {
    background: #c6deb5; color: #222; font-weight: 700; font-size: 10px;
    text-transform: none; letter-spacing: normal; border-bottom: 1px solid #999;
  }
  .xtable thead th.xtitulo { font-size: 14px; font-weight: 700; text-align: left; }
  .xtable td.xfam { font-weight: 700; }
  /* Barra de separación entre familias, para que se note claramente donde
     termina una familia y empieza la siguiente (pedido explícito del usuario). */
  .xtable tbody tr.xgrupo-nuevo td { border-top: 2px solid #444; }
  .xtable td:nth-child(2) { font-weight: 700; }
  .xc { text-align: center; }
  .xnum { text-align: right; }
  .xfalta { background: #ffc7ce; color: #9c0006; font-weight: 600; text-align: center; }
  .xbien { background: #c6efce; color: #006100; font-weight: 600; }
  .xmal { background: #ffeb9c; color: #9c6500; font-weight: 600; }
  #captureStage table.tbl-new { font-size: 11px; }
  #captureStage table.tbl-new th, #captureStage table.tbl-new td { padding: 3px 8px; }
  #captureStage .familia-block { border: 1px solid #ccc; border-radius: 0; margin-bottom: 3px; }
  #captureStage .familia-title { padding: 4px 10px; font-size: 12px; background: #ffe699; }
  #captureStage .totales-footer { margin: 0; padding: 8px 0; }

  /* Estilo del "lienzo" que arma html2canvas al generar la imagen para WhatsApp
     (título + tabla estilo Excel + pie de totales), a partir del contenido oculto
     en #mainCaptura/#footerCaptura. */
  .capture-render {
    background: #ffffff;
    padding: 14px;
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
  }
  .capture-render .capture-title {
    background: #f4b183;
    color: #111;
    font-weight: 700;
    font-size: 18px;
    padding: 6px 12px;
    margin-bottom: 6px;
    border-radius: 4px;
  }
  .capture-render .capture-updated {
    font-size: 11px;
    color: #555;
    margin-bottom: 10px;
  }
  /* La base ".totales-footer" trae margin:8px 24px 32px 24px (pensado para la página
     en vivo). Acá lo reseteamos a 0 para que, en la imagen de WhatsApp, el pie de
     totales ocupe exactamente el mismo ancho que la tabla de datos de arriba (sin
     los 24px de margen izquierdo/derecho que lo angostaban). */
  .capture-render .totales-footer { margin: 10px 0 0 0; padding: 8px 0; }
  .capture-render .totales-footer .num { font-size: 15px; }
</style>
</head>
<body>

<header>
  <h1>STOCKS NEGATIVOS x FÁBRICA</h1>
  <div class="sub">
    <span id="status">Cargando datos...</span>
    <button id="refreshBtn" onclick="loadAll()">↻ Actualizar ahora</button>
    <button id="captureBtn" onclick="captureCurrentView()">📷 Copiar imagen (WhatsApp)</button>
    <span id="captureMsg"></span>
  </div>
</header>

<div id="errorBanner"></div>

<div class="tabs-primary" id="tabsPrimary"></div>
<div class="tabs-secondary" id="tabsSecondary" style="display:none;"></div>
<main id="main">
  <div id="loadingBanner">Cargando datos desde Google Sheets...</div>
</main>
<div class="totales-footer" id="totalesFooter" style="display:none;"></div>
<!-- Arbol oculto SOLO para armar la imagen de WhatsApp (ver renderVistaCapturaExcel/
     captureCurrentView). Usa visibility:hidden (no left:-9999px) porque esta tabla puede
     ser mas ancha que 9999px con muchas filas/descripciones largas (ej. CÓDIGOS SIN
     CLASIFICAR) — con un offset fijo, el borde derecho terminaba entrando de nuevo en
     la pantalla visible y se veia superpuesto sobre el contenido real. visibility:hidden
     lo oculta sin importar el ancho, y sigue permitiendo medir su tamaño real con
     getBoundingClientRect() (a diferencia de width:0, que rompe las columnas por
     porcentaje de la tabla de "sin clasificar"). -->
<div id="captureStage" style="position:absolute; top:0; left:0; visibility:hidden; pointer-events:none;">
  <div id="mainCaptura"></div>
  <div class="totales-footer" id="footerCaptura"></div>
</div>

const TAB_SUBS = {"BARMAN": ["BARMAN"], "IMPRESO": ["IMPRESO"], "MANTELES": ["MANTELES"], "GRUPO L+MOSTAZA": ["GRUPO L", "LABELFLEX", "MOSTAZA"], "TUBOS": ["TUBOS"], "GANGA+FANSPAPER+NUVIA+GRUPO L": ["GANGA + FANSPAPER + NUVIA", "GRUPO L"], "VYMAT": ["VYMAT"], "AROMES+FOOD+DELMAR+NAVAS...": ["AROMES", "DELMAR", "FOOD PACKAGING", "GRUPO L", "LABELFLEX", "NAVAS", "PIRELUX", "POLYLIMP", "SUIPACHA", "TOBAUT"]};             // tab -> [subclientes] (>1 solo en las combinadas)

function csvUrl(gid) {
  return "https://docs.google.com/spreadsheets/d/e/" + SHEET_KEY + "/pub?gid=" + gid + "&single=true&output=csv";
}

function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* ignore */ }
      else field += c;
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.length > 1 || (r[0] && r[0].trim())).map(r => {
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = (r[idx] !== undefined ? r[idx] : '').trim(); });
    return obj;
  });
}

function parseNum(s) {
  if (s === null || s === undefined) return 0;
  s = String(s).trim();
  if (s === '') return 0;
  if (s.includes(',') && s.includes('.')) {
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (s.includes(',')) {
    s = s.replace(',', '.');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function fmtNum(n) {
  return n.toLocaleString('es-AR', { maximumFractionDigits: 2 });
}

async function fetchCSV(gid) {
  const res = await fetch(csvUrl(gid), { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  return parseCSV(text);
}

// STATE.data[tab][sub][familia] = [rowData, ...]
let STATE = { data: {}, newCodes: [], totalNegativos: 0, sinCobertura: 0, sumaNegativos: 0, sumaPorTab: {} };
let HISTORIAL_ROWS = null;
let HISTORIAL_ERROR = null;

async function loadAll() {
  document.getElementById('status').textContent = 'Actualizando...';
  document.getElementById('errorBanner').style.display = 'none';
  document.getElementById('refreshBtn').disabled = true;
  try {
    const [stockRows, ocBarman, ocGrafica, ocTubos, ocVymat] = await Promise.all([
      fetchCSV(GIDS.STOCK_CENTRAL),
      fetchCSV(GIDS.OC_BARMAN),
      fetchCSV(GIDS.OC_GRAFICA),
      fetchCSV(GIDS.OC_TUBOS),
      fetchCSV(GIDS.OC_VYMAT),
    ]);

    const ocSets = { 'OC BARMAN': ocBarman, 'OC GRAFICA': ocGrafica, 'OC TUBOS': ocTubos, 'OC VYMAT': ocVymat };
    const ocMap = {};
    for (const [origen, rows] of Object.entries(ocSets)) {
      for (const r of rows) {
        const cod = (r['COD'] || '').trim();
        if (!cod) continue;
        if (!ocMap[cod]) ocMap[cod] = { saldoEnviar: 0, ords: new Set(), origenes: new Set() };
        ocMap[cod].saldoEnviar += parseNum(r['SALDO ENVIAR']);
        if (r['ORD COM']) ocMap[cod].ords.add(r['ORD COM'].trim());
        ocMap[cod].origenes.add(origen);
      }
    }

    const data = {};
    const sumaPorTab = {};
    TAB_ORDER.forEach(t => { data[t] = {}; sumaPorTab[t] = 0; (TAB_SUBS[t] || [t]).forEach(s => data[t][s] = {}); });
    let sumaSinClasificar = 0;
    const newCodes = [];
    let totalNegativos = 0;
    let sinCobertura = 0;
    let sumaNegativos = 0;

    for (const r of stockRows) {
      const cod = (r['CODIGO'] || '').trim();
      if (!cod) continue;
      const stockDisp = parseNum(r['STOCK DISPONIBLE']);
      if (stockDisp >= 0) continue;

      totalNegativos++;
      sumaNegativos += stockDisp;
      const desc = r['MATERIA PRIMA'] || '';
      const pendiente = parseNum(r['PEDIDO']);
      const stockFisico = parseNum(r['STOCK SISTEMA']);
      const ocInfo = ocMap[cod];
      const saldoEnviar = ocInfo ? ocInfo.saldoEnviar : 0;
      const ords = ocInfo ? Array.from(ocInfo.ords).join(', ') : '';
      const ocDif = stockDisp + saldoEnviar;
      if (ocDif < 0) sinCobertura++;

      const rowData = { cod, desc, stockFisico, pendiente, stockDisp, ords, saldoEnviar, ocDif };

      const clases = CLASSIFICATION[cod];
      if (!clases || clases.length === 0) {
        sumaSinClasificar += stockDisp;
        const origenOC = ocInfo ? Array.from(ocInfo.origenes).join(', ') : null;
        newCodes.push({ ...rowData, origen: origenOC || 'Sin OC asociada (detectado en STOCK CENTRAL)' });
      } else {
        // Un mismo código puede figurar en varios sub-clientes de la misma solapa
        // (ej. PS1103 en GRUPO L y en LABELFLEX): se sigue mostrando en cada uno
        // para que ambos equipos lo vean, pero representa UN solo faltante real,
        // así que solo debe sumar una vez al total de la solapa.
        const tabsYaContados = new Set();
        for (const [tab, sub, familia] of clases) {
          if (!data[tab]) data[tab] = {};
          if (!data[tab][sub]) data[tab][sub] = {};
          const fam = familia || 'SIN FAMILIA';
          if (!data[tab][sub][fam]) data[tab][sub][fam] = [];
          data[tab][sub][fam].push(rowData);
          if (!tabsYaContados.has(tab)) {
            sumaPorTab[tab] = (sumaPorTab[tab] || 0) + stockDisp;
            tabsYaContados.add(tab);
          }
        }
      }
    }

    for (const tab of Object.keys(data)) {
      for (const sub of Object.keys(data[tab])) {
        for (const fam of Object.keys(data[tab][sub])) {
          data[tab][sub][fam].sort((a, b) => a.stockDisp - b.stockDisp);
        }
      }
    }
    newCodes.sort((a, b) => a.stockDisp - b.stockDisp);

    STATE = { data, newCodes, totalNegativos, sinCobertura, sumaNegativos, sumaPorTab, sumaSinClasificar };
    renderPrimaryTabs();
    renderSecondaryTabs();
    renderActive();
    await loadHistorial();
    renderTotalesFooter();

    const now = new Date().toLocaleString('es-AR');
    document.getElementById('status').textContent = 'Actualizado: ' + now;
  } catch (err) {
    console.error(err);
    document.getElementById('errorBanner').textContent = 'No se pudo actualizar la información: ' + err.message + '. Verificá la conexión o que el Google Sheets siga publicado.';
    document.getElementById('errorBanner').style.display = 'block';
    document.getElementById('status').textContent = 'Error al actualizar';
  } finally {
    document.getElementById('refreshBtn').disabled = false;
  }
}

async function loadHistorial() {
  // Se conserva la carga de HISTORIAL_ROWS: la usa la evolución por segmento
  // que se muestra al pie de cada solapa (renderTotalesFooter).
  if (!GIDS.HISTORIAL) {
    HISTORIAL_ROWS = null;
    return;
  }
  try {
    HISTORIAL_ROWS = await fetchCSV(GIDS.HISTORIAL);
    HISTORIAL_ERROR = null;
  } catch (err) {
    console.error(err);
    HISTORIAL_ROWS = null;
    HISTORIAL_ERROR = err.message;
  }
}

function findPrevRow(rows) {
  const todayStr = new Date().toISOString().slice(0,10);
  for (let i = rows.length - 1; i >= 0; i--) {
    const fecha = (rows[i]['FECHA'] || '').trim();
    if (fecha && fecha.slice(0,10) !== todayStr) return rows[i];
  }
  return null;
}

let activeTab = TAB_ORDER[0];

const TAB_CON_FILTRO_MANTELES = 'GRUPO L+MOSTAZA';
function familiaCoincideFiltro(nombre) {
  const n = (nombre || '').trim().toUpperCase();
  if (filtroFamilia === 'MANTELES') return n === 'MANTELES';
  if (filtroFamilia === 'SERVILLETAS') return n.startsWith('SERVILLETAS');
  return true;
}
function filtrarPorFamilia(familias) {
  if (!(activeTab === TAB_CON_FILTRO_MANTELES && filtroFamilia)) return familias;
  const out = {};
  Object.keys(familias).forEach(k => { if (familiaCoincideFiltro(k)) out[k] = familias[k]; });
  return out;
}

function countTab(tab) {
  const subs = STATE.data[tab] || {};
  const cods = new Set();
  for (const sub of Object.keys(subs)) {
    for (const arr of Object.values(subs[sub])) arr.forEach(r => cods.add(r.cod));
  }
  return cods.size;
}
function countSub(tab, sub) {
  const fams = (STATE.data[tab] || {})[sub] || {};
  return Object.values(fams).reduce((acc, arr) => acc + arr.length, 0);
}

const COLGROUP_MAIN = '<colgroup><col class="c-cod"><col class="c-desc"><col class="c-fisico"><col class="c-pend"><col class="c-stock"><col class="c-oc"><col class="c-ocdif"></colgroup>';
const COLGROUP_NEW = '<colgroup><col class="c-cod"><col class="c-desc"><col class="c-fisico"><col class="c-pend"><col class="c-stock"><col class="c-origen"></colgroup>';

function rowHTML(r) {
  const ocDifClass = r.ocDif >= 0 ? 'ocdif-cubierto' : 'ocdif-falta';
  return '<tr>' +
    '<td>' + r.cod + '</td>' +

    '</tr>';
}

const SERVILLETAS_ORDEN = ['Servilletas 33s', 'Servilletas 24s', 'Servilletas 18s'];
function ordenFamilias(nombres) {
  const prioridad = SERVILLETAS_ORDEN.filter(n => nombres.includes(n));
  const resto = nombres.filter(n => !SERVILLETAS_ORDEN.includes(n)).sort();
  return prioridad.concat(resto);
}

// Formato de VISUALIZACIÓN de la familia (no altera CLASSIFICATION ni el orden/filtro,
// que siguen usando el nombre original): todo en MAYÚSCULA, y a las servilletas se les
// quita la "s" que sigue al número (ej. "Servilletas 33s" -> "SERVILLETAS 33").
function formatFamiliaDisplay(nombre) {
  if (!nombre) return nombre;
  return nombre.toUpperCase().replace(/(\d)S\b/g, '$1');
}

function renderFamiliaBlocks(container, familias) {
  const famNames = ordenFamilias(Object.keys(familias));
  famNames.forEach(fam => {
    const rows = familias[fam];
    const block = document.createElement('div');
    block.className = 'familia-block';
    block.innerHTML = '<div class="familia-title">' + formatFamiliaDisplay(fam) + '</div>';
    const table = document.createElement('table');
    table.className = 'tbl-main';
    table.innerHTML = COLGROUP_MAIN + '<thead><tr><th>Código</th><th>Descripción</th><th>Stock físico</th><th>Pendientes</th><th>Stock negativo</th><th>Nro OC</th><th>OC DIF</th></tr></thead><tbody>' +
      rows.map(rowHTML).join('') + '</tbody>';
    block.appendChild(table);
    container.appendChild(block);
  });
}

function renderActiveInner() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  if (activeTab === '__NEW__') {
    const list = STATE.newCodes || [];
    if (!list.length) {
      main.innerHTML = '<div class="empty-msg">No hay códigos nuevos sin clasificar. Todo lo que está en negativo ya pertenece a un grupo conocido.</div>';
      return;
    }
    const block = document.createElement('div');
    block.className = 'familia-block';
    block.innerHTML = '<div class="familia-title">Códigos con stock negativo que no están clasificados en ningún grupo</div>';
    const table = document.createElement('table');
    table.className = 'tbl-new';
    table.innerHTML = COLGROUP_NEW + '<thead><tr><th>Código</th><th>Descripción</th><th>Stock físico</th><th>Pendientes</th><th>Stock negativo</th><th>Encontrado en</th></tr></thead><tbody>' +
      list.map(r => '<tr><td>' + r.cod + '</td><td>' + r.desc + '</td><td>' + (r.stockFisico ? fmtNum(r.stockFisico) : '—') + '</td><td>' + (r.pendiente ? fmtNum(r.pendiente) : '—') + '</td><td class="neg">' + fmtNum(r.stockDisp) + '</td><td class="muted">' + r.origen + '</td></tr>').join('') +
      '</tbody>';
    block.appendChild(table);
    main.appendChild(block);
    return;
  }

  const subs = TAB_SUBS[activeTab] || [activeTab];
  const tabData = STATE.data[activeTab] || {};

  if (subs.length <= 1) {
    const familias = filtrarPorFamilia(tabData[subs[0]] || {});
    if (!Object.keys(familias).length) {
      main.innerHTML = '<div class="empty-msg">Sin códigos negativos en este segmento. 🎉</div>';
      return;
    }
    renderFamiliaBlocks(main, familias);
    return;
  }

  if (activeSub === 'ALL') {
    let anyContent = false;
    subs.forEach(sub => {
      const familias = filtrarPorFamilia(tabData[sub] || {});
      const count = Object.values(familias).reduce((acc, arr) => acc + arr.length, 0);
      if (count === 0) return;
      anyContent = true;
      const banner = document.createElement('div');
      banner.className = 'sub-banner';
      banner.textContent = sub;
      main.appendChild(banner);
      renderFamiliaBlocks(main, familias);
    });
    if (!anyContent) {
      main.innerHTML = '<div class="empty-msg">Sin códigos negativos en este segmento. 🎉</div>';
    }
  } else {
    const familias = filtrarPorFamilia(tabData[activeSub] || {});
    if (!Object.keys(familias).length) {
      main.innerHTML = '<div class="empty-msg">Sin códigos negativos en ' + activeSub + '. 🎉</div>';
      return;
    }
    renderFamiliaBlocks(main, familias);
  }
}

function filasConFamilia(familias) {

    familias[fam].forEach((r, idx) => filas.push({ r, fam: idx === 0 ? fam : '', nuevoGrupo: idx === 0 && famIdx > 0 }));

  return filas;
}

// Autoajuste de columnas (equivalente a "Autoajustar ancho de columna" de Excel): mide el
// ancho real del texto con canvas y calcula UN solo set de anchos por vista, para que varias
// sub-tablas apiladas (como en "TODOS") queden perfectamente alineadas entre si.
let _medirCtx = null;
function medirTextoPx(texto, font) {
  if (!_medirCtx) _medirCtx = document.createElement('canvas').getContext('2d');
  _medirCtx.font = font;
  return _medirCtx.measureText(String(texto == null ? '' : texto)).width;
}
const XFONT_HEADER = '700 10px Arial, Helvetica, sans-serif';
const XFONT_TITLE  = '700 14px Arial, Helvetica, sans-serif';
const XFONT_BODY   = '400 11px Arial, Helvetica, sans-serif';
const XFONT_BODY_B = '700 11px Arial, Helvetica, sans-serif';
const XFONT_FALTA  = '600 11px Arial, Helvetica, sans-serif';
const XCELL_PAD = 14;

function calcularAnchosXTable(secciones) {
  let wFam = medirTextoPx('FAMILIA', XFONT_HEADER);
  let wCod = medirTextoPx('CODIGO', XFONT_HEADER);
  let wDesc = 0;
  let wFisico = Math.max(medirTextoPx('STOCK', XFONT_HEADER), medirTextoPx('FÍSICO', XFONT_HEADER));
  let wPend = medirTextoPx('PENDIENTES', XFONT_HEADER);
  let wStock = Math.max(medirTextoPx('STOCK', XFONT_HEADER), medirTextoPx('NEGATIVO', XFONT_HEADER));
  let wOc = medirTextoPx('NRO OC', XFONT_HEADER);
  let wOcDif = medirTextoPx('OC DIF', XFONT_HEADER);

  secciones.forEach(sec => {
    wDesc = Math.max(wDesc, medirTextoPx(sec.titulo, XFONT_TITLE));
    filasConFamilia(sec.familias).forEach(item => {
      const r = item.r;
      if (item.fam) wFam = Math.max(wFam, medirTextoPx(formatFamiliaDisplay(item.fam), XFONT_BODY_B));
      wCod = Math.max(wCod, medirTextoPx(r.cod, XFONT_BODY_B));
      wDesc = Math.max(wDesc, medirTextoPx(r.desc, XFONT_BODY));
      wFisico = Math.max(wFisico, medirTextoPx(fmtNum(r.stockFisico), XFONT_BODY));
      wPend = Math.max(wPend, medirTextoPx(fmtNum(r.pendiente), XFONT_BODY));
      wStock = Math.max(wStock, medirTextoPx(fmtNum(r.stockDisp), XFONT_BODY));
      const tieneOC = !!(r.ords && r.ords.trim());
      wOc = Math.max(wOc, medirTextoPx(tieneOC ? r.ords : 'FALTA', tieneOC ? XFONT_BODY : XFONT_FALTA));
      wOcDif = Math.max(wOcDif, medirTextoPx(tieneOC ? fmtNum(r.ocDif) : 'FALTA', tieneOC ? XFONT_BODY : XFONT_FALTA));
    });
  });

  return {
    fam: Math.ceil(wFam + XCELL_PAD),
    cod: Math.ceil(wCod + XCELL_PAD),
    desc: Math.ceil(wDesc + XCELL_PAD),
    fisico: Math.ceil(wFisico + XCELL_PAD),
    pend: Math.ceil(wPend + XCELL_PAD),
    stock: Math.ceil(wStock + XCELL_PAD),
    oc: Math.ceil(wOc + XCELL_PAD),
    ocdif: Math.ceil(wOcDif + XCELL_PAD),
  };
}

function colgroupXTable(a) {
  return '<colgroup>' +
    '<col style="width:' + a.fam + 'px">' +
    '<col style="width:' + a.cod + 'px">' +
    '<col style="width:' + a.desc + 'px">' +
    '<col style="width:' + a.fisico + 'px">' +
    '<col style="width:' + a.pend + 'px">' +
    '<col style="width:' + a.stock + 'px">' +
    '<col style="width:' + a.oc + 'px">' +
    '<col style="width:' + a.ocdif + 'px">' +
    '</colgroup>';
}

function renderExcelTable(container, familias, titulo, anchos) {
  const filas = filasConFamilia(familias);
  if (!filas.length) return;
  const table = document.createElement('table');
  table.className = 'xtable';
  table.innerHTML = colgroupXTable(anchos) +
    '<thead><tr><th>Familia</th><th>Codigo</th><th class="xtitulo">' + titulo + '</th><th class="xnum">Stock<br>físico</th><th class="xnum">Pendientes</th><th class="xnum">Stock<br>negativo</th><th class="xc">Nro OC</th><th class="xc">OC DIF</th></tr></thead>' +
    '<tbody>' + filas.map(xrowHTML).join('') + '</tbody>';
  container.appendChild(table);
}

// Arma, en el arbol oculto #mainCaptura, la MISMA vista que se esta viendo en vivo
// (misma solapa/sub-cliente/filtro), pero con el formato compacto estilo Excel.
function renderVistaCapturaExcel() {
  const main = document.getElementById('mainCaptura');
  if (!main) return;
  main.innerHTML = '';

  if (activeTab === '__NEW__') {
    const list = STATE.newCodes || [];
    if (!list.length) return;
    const block = document.createElement('div');
    block.className = 'familia-block';
    block.innerHTML = '<div class="familia-title">Códigos con stock negativo que no están clasificados en ningún grupo</div>';
    const table = document.createElement('table');
    table.className = 'tbl-new';
    table.innerHTML = COLGROUP_NEW + '<thead><tr><th>Código</th><th>Descripción</th><th>Stock físico</th><th>Pendientes</th><th>Stock negativo</th><th>Encontrado en</th></tr></thead><tbody>' +
      list.map(r => '<tr><td>' + r.cod + '</td><td>' + r.desc + '</td><td>' + (r.stockFisico ? fmtNum(r.stockFisico) : '—') + '</td><td>' + (r.pendiente ? fmtNum(r.pendiente) : '—') + '</td><td class="neg">' + fmtNum(r.stockDisp) + '</td><td class="muted">' + r.origen + '</td></tr>').join('') +
      '</tbody>';
    block.appendChild(table);
    main.appendChild(block);
    return;
  }

  const subs = TAB_SUBS[activeTab] || [activeTab];
  const tabData = STATE.data[activeTab] || {};

  if (subs.length <= 1) {
    const familias = filtrarPorFamilia(tabData[subs[0]] || {});
    if (!Object.keys(familias).length) return;
    const anchos = calcularAnchosXTable([{ titulo: subs[0], familias }]);
    renderExcelTable(main, familias, subs[0], anchos);
    return;
  }

  if (activeSub === 'ALL') {
    const secciones = subs
      .map(sub => ({ sub, familias: filtrarPorFamilia(tabData[sub] || {}) }))
      .filter(sec => Object.values(sec.familias).reduce((acc, arr) => acc + arr.length, 0) > 0);
    if (!secciones.length) return;
    const anchos = calcularAnchosXTable(secciones.map(sec => ({ titulo: sec.sub, familias: sec.familias })));
    secciones.forEach(sec => renderExcelTable(main, sec.familias, sec.sub, anchos));
  } else {
    const familias = filtrarPorFamilia(tabData[activeSub] || {});
    if (!Object.keys(familias).length) return;
    const anchos = calcularAnchosXTable([{ titulo: activeSub, familias }]);
    renderExcelTable(main, familias, activeSub, anchos);
  }
}

// Wrapper publico: renderiza la vista en vivo (estilo v17) y, en paralelo, mantiene
// actualizada la copia oculta estilo Excel que usa el boton de captura.
function renderActive() {
  renderActiveInner();
  renderVistaCapturaExcel();
}

function renderTotalesFooter() {
  const el = document.getElementById('totalesFooter');
  const elCap = document.getElementById('footerCaptura');

  if (activeTab === '__NEW__') {
    const list = STATE.newCodes || [];
    const suma = STATE.sumaSinClasificar || 0;
    el.style.display = 'flex';
    if (elCap) elCap.style.display = 'flex';
    let evoHtml = '';
    if (HISTORIAL_ROWS && HISTORIAL_ROWS.length) {
      const prevRow = findPrevRow(HISTORIAL_ROWS);
      if (prevRow && prevRow.hasOwnProperty('SIN CLASIFICAR')) {
        const ayer = parseNum(prevRow['SIN CLASIFICAR']);
        const delta = suma - ayer;
        const cls = delta >= 0 ? 'mejor' : 'peor';
        const txt = delta >= 0 ? '▲ Redujo ' + fmtNum(Math.abs(delta)) : '▼ Aumentó ' + fmtNum(Math.abs(delta));
        evoHtml = '<div class="evo"><span class="delta ' + cls + '">' + txt + '</span></div>';
      }
    }
    const htmlNew =
      '<div class="tf-row">' +
        '<div class="tf-cell" style="flex:0 1 10%"></div>' +
        '<div class="tf-cell" style="flex:1 1 44%; min-width:0;"><div class="item"><div class="num">' + list.length + '</div><div class="lbl">Códigos sin clasificar</div></div></div>' +
        '<div class="tf-cell tf-center" style="flex:1 1 14%; min-width:0;"><div class="item"><div class="num neg">' + fmtNum(suma) + '</div><div class="lbl">Suma negativos sin clasificar</div></div></div>' +
        '<div class="tf-cell" style="flex:1 1 32%; min-width:0; display:flex; align-items:center;">' + evoHtml + '</div>' +
      '</div>';
    el.innerHTML = htmlNew;
    if (elCap) elCap.innerHTML = htmlNew;
    return;
  }

  const subs = TAB_SUBS[activeTab] || [activeTab];
  const tabData = STATE.data[activeTab] || {};
  let subsToSum = subs;
  if (subs.length > 1 && activeSub !== 'ALL') subsToSum = [activeSub];

  // Igual que en countTab/allCount: si el mismo código aparece en más de un
  // sub-cliente dentro de subsToSum (ej. PS1103 en GRUPO L y LABELFLEX), cuenta
  // una sola vez tanto en la cantidad de códigos como en la suma de negativos.
  let count = 0, suma = 0;
  const codsVistos = new Set();
  subsToSum.forEach(sub => {
    const familias = filtrarPorFamilia(tabData[sub] || {});
    Object.values(familias).forEach(arr => {
      arr.forEach(r => {
        if (codsVistos.has(r.cod)) return;
        codsVistos.add(r.cod);
        count++; suma += r.stockDisp;
      });
    });
  });

  el.style.display = 'flex';
  if (elCap) elCap.style.display = 'flex';
  let evoHtml = '';
  // La evolución se registra en HISTORIAL a nivel de pestaña principal (los 8 segmentos).
  // Pero si en GRUPO L+MOSTAZA hay un filtro de familia activo (Solo Manteles / Solo
  // Servilletas), hay que comparar contra el subtotal de ESE filtro, no contra el total
  // combinado de todo el segmento — para eso HISTORIAL guarda columnas aparte
  // ("GRUPO L+MOSTAZA - MANTELES" / "GRUPO L+MOSTAZA - SERVILLETAS").
  const filtroActivo = (activeTab === TAB_CON_FILTRO_MANTELES && filtroFamilia);
  const historialKey = filtroActivo ? (activeTab + ' - ' + filtroFamilia) : activeTab;
  const hoyEvo = filtroActivo ? suma : (STATE.sumaPorTab[activeTab] || 0);
  if (HISTORIAL_ROWS && HISTORIAL_ROWS.length && HISTORIAL_ROWS[0].hasOwnProperty(historialKey)) {
    const prevRow = findPrevRow(HISTORIAL_ROWS);
    const ayerRaw = prevRow ? prevRow[historialKey] : null;
    const ayerStr = (ayerRaw === undefined || ayerRaw === null) ? '' : String(ayerRaw).trim();
    if (ayerStr !== '') {
      const ayer = parseNum(ayerRaw);
      const delta = hoyEvo - ayer;
      const cls = delta >= 0 ? 'mejor' : 'peor';
      const txt = delta >= 0 ? '▲ Redujo ' + fmtNum(Math.abs(delta)) : '▼ Aumentó ' + fmtNum(Math.abs(delta));
      evoHtml = '<div class="evo"><span class="delta ' + cls + '">' + txt + '</span></div>';
    }
  }

  const htmlMain =
    '<div class="tf-row">' +
      '<div class="tf-cell" style="flex:0 1 9%"></div>' +
      '<div class="tf-cell" style="flex:1 1 33%; min-width:0;"><div class="item"><div class="num">' + count + '</div><div class="lbl"><span style="white-space:nowrap;">Códigos negativos</span><br><span style="white-space:nowrap;">en esta vista</span></div></div></div>' +
      '<div class="tf-cell tf-center" style="flex:1 1 12%; min-width:0;"><div class="item"><div class="num neg">' + fmtNum(suma) + '</div><div class="lbl"><span style="white-space:nowrap;">Suma total</span><br><span style="white-space:nowrap;">de negativos</span></div></div></div>' +
      '<div class="tf-cell" style="flex:1 1 46%; min-width:0; display:flex; align-items:center;">' + evoHtml + '</div>' +
    '</div>';
  el.innerHTML = htmlMain;
  if (elCap) elCap.innerHTML = htmlMain;
}


function tituloVistaActual() {
  if (activeTab === '__NEW__') return 'CÓDIGOS SIN CLASIFICAR';
  let t = activeTab;
  const subs = TAB_SUBS[activeTab] || [];
  if (subs.length > 1 && activeSub !== 'ALL') t += ' — ' + activeSub;
  if (activeTab === TAB_CON_FILTRO_MANTELES && filtroFamilia) t += ' — Solo ' + (filtroFamilia === 'MANTELES' ? 'Manteles' : 'Servilletas');
  return t;
}

function anchoTablaCapturaPx() {
  const tabla = document.querySelector('#mainCaptura table.xtable') || document.querySelector('#mainCaptura table.tbl-new');
  if (tabla) return Math.ceil(tabla.getBoundingClientRect().width);
  return 1150; // vista vacia (sin negativos) u otro caso sin tabla: ancho razonable por defecto
}

async function captureCurrentView() {
  const btn = document.getElementById('captureBtn');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Generando imagen...';
  let wrapper = null;
  try {
    wrapper = document.createElement('div');
    wrapper.className = 'capture-render';
    // El ancho del "lienzo" se ajusta al ancho real de la tabla estilo Excel (oculta en
    // #mainCaptura), asi la fecha de actualizacion, la tabla y el pie de totales quedan
    // todos con el mismo ancho exacto (ya no se incluye el titulo naranja de la solapa).
    const anchoLienzo = anchoTablaCapturaPx() + 14 * 2; // + padding del wrapper (14px por lado)
    wrapper.style.width = anchoLienzo + 'px';
    wrapper.style.position = 'fixed';
    wrapper.style.left = '-9999px';
    wrapper.style.top = '0';
    wrapper.style.zIndex = '-1';

    const updatedDiv = document.createElement('div');
    updatedDiv.className = 'capture-updated';
    updatedDiv.textContent = document.getElementById('status').textContent;
    wrapper.appendChild(updatedDiv);

    // Clona la copia OCULTA estilo Excel (#mainCaptura/#footerCaptura), no la vista en
    // vivo (#main/#totalesFooter), que ahora mantiene el look moderno tipo v17.
    wrapper.appendChild(document.getElementById('mainCaptura').cloneNode(true));
    wrapper.appendChild(document.getElementById('footerCaptura').cloneNode(true));

    document.body.appendChild(wrapper);
    const canvas = await html2canvas(wrapper, { backgroundColor: '#ffffff', scale: 2 });
    document.body.removeChild(wrapper);
    wrapper = null;

    canvas.toBlob(async (blob) => {
      let copiado = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          copiado = true;
        }
      } catch (err) {
        console.error('No se pudo copiar al portapapeles:', err);
      }
      if (copiado) {
        mostrarAvisoCaptura('✅ Imagen copiada — pegala con Ctrl+V en WhatsApp.');
      } else {
        const link = document.createElement('a');
        link.download = 'stock-negativo-' + activeTab.replace(/[^a-zA-Z0-9]+/g, '_') + '.png';
        link.href = URL.createObjectURL(blob);
        link.click();
        mostrarAvisoCaptura('No se pudo copiar directo (navegador sin soporte) — se descargó la imagen.');
      }
      btn.disabled = false;
      btn.textContent = original;
    }, 'image/png');
  } catch (err) {
    console.error(err);
    if (wrapper && wrapper.parentNode) document.body.removeChild(wrapper);
    mostrarAvisoCaptura('Error al generar la imagen: ' + err.message);
    btn.disabled = false;
    btn.textContent = original;
  }
}

function mostrarAvisoCaptura(msg) {
  const el = document.getElementById('captureMsg');
  el.textContent = msg;
  el.style.display = 'inline-block';
  clearTimeout(window.__captureMsgTimeout);
  window.__captureMsgTimeout = setTimeout(() => { el.style.display = 'none'; }, 5000);
}
